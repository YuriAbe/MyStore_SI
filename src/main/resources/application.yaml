server:
  port: 8889
spring:
  application:
    name: MyStore
  datasource:
    url: jdbc:postgresql://localhost:5432/mystore
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  mvc:
    hiddenmethod:
      filter:
        enabled: true
  mvc:
    hiddenmethod:
      filter:
        enabled: true


