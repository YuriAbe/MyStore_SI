<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{_layouts/base :: head(~{::title})}">
    <title th:text="${category.id == null ? 'Nova Categoria' : 'Editar Categoria'}"></title>
</head>
<body>
<main th:replace="~{_layouts/base :: layout(~{::content})}">
    <div th:fragment="content">
        <div class="container mt-4">
            <h2 th:text="${category.id == null ? 'Nova Categoria' : 'Editar Categoria'}"></h2>

            <form th:action="@{/categories}" th:if="${category.id == null}"
                  th:object="${category}" method="post" class="needs-validation" novalidate>
                <div class="mb-3">
                    <label for="name" class="form-label">Nome da Categoria</label>
                    <input type="text" class="form-control" id="name" th:field="*{name}" required>
                    <div class="invalid-feedback">
                        Por favor, informe o nome da categoria.
                    </div>
                </div>

                <div class="mb-3">
                    <a href="/categories" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>

            <form th:action="@{/categories/{id}(id=${category.id})}" th:if="${category.id != null}"
                  th:object="${category}" method="post" class="needs-validation" novalidate>
                <input type="hidden" th:field="*{id}" />
                <input type="hidden" name="_method" value="put" />
                <div class="mb-3">
                    <label for="name" class="form-label">Nome da Categoria</label>
                    <input type="text" class="form-control" id="name" th:field="*{name}" required>
                    <div class="invalid-feedback">
                        Por favor, informe o nome da categoria.
                    </div>
                </div>

                <div class="mb-3">
                    <a href="/categories" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
