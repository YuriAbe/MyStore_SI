<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<!-- replacing the head with title  -->
<head th:replace="~{_layouts/base :: head(~{::title})}">
    <title th:fragment="title">Categorias</title>
</head>
<body>
<!-- replacing the main content -->
<main th:replace="~{_layouts/base :: layout(~{::content})}">
    <div th:fragment="content">
        <div style="min-height: 600px" class="p-3">
            <h1 class="text-primary">Categorias</h1>
            <hr>
            <a href="/categories/new" class="btn btn-primary">Adicionar Categoria</a>
            <table class="table">
                <thead>
                    <th>ID</th>
                    <th>Nome</th>
                    <th colspan="3">Operações</th>
                </thead>
                <tbody>
                    <tr th:each="category : ${categories}">
                        <td th:text="${category.id}"></td>
                        <td th:text="${category.name}"></td>
                        <td>
                            <button type="button" class="btn btn-primary btn-visualizar"
                                data-bs-toggle="modal" data-bs-target="#modalCategoria"
                                th:attr="data-id=${category.id},data-name=${category.name}">
                                Visualizar
                            </button>
                        </td>
                        <td>
                            <a th:href="@{/categories/{id}/edit(id=${category.id})}" class="btn btn-info">Editar</a>
                        </td>
                        <td>
                            <form class="delete-form" th:action="@{/categories/{id}(id=${category.id})}" method="post">
                                <input type="hidden" name="_method" value="delete" />
                                <button type="submit" class="btn btn-danger">Excluir</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
            
            <!-- Toast para mensagens -->
            <div th:replace="~{_fragments/toast :: toast(${message})}"></div>
            
            <!-- Script do modal.js para confirmação -->
            <script th:src="@{/js/modal.js}"></script>
            
            <!-- Event listener para confirmação de exclusão -->
            <script>
                document.querySelectorAll('.delete-form').forEach(form => {
                    form.addEventListener("submit", async (e) => {
                        e.preventDefault();
                        const confirm = await showConfirmModal("Confirme", "Deseja excluir essa categoria?");
                        if(confirm){
                            form.submit();
                        }
                    })
                })
            </script>
        </div>
        <!-- Modal Visualizar Categoria -->
        <div class="modal fade" id="modalCategoria" tabindex="-1" aria-labelledby="modalCategoriaLabel" aria-hidden="true">
          <div class="modal-dialog">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title" id="modalCategoriaLabel">Detalhes da Categoria</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
              </div>
              <div class="modal-body">
                <p><strong>ID:</strong> <span id="modalCategoriaId"></span></p>
                <p><strong>Nome:</strong> <span id="modalCategoriaNome"></span></p>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
              </div>
            </div>
          </div>
        </div>
        <script>
          document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM Carregado');
            var modalCategoria = document.getElementById('modalCategoria');
            console.log('Modal elemento:', modalCategoria);
            
            if (typeof bootstrap !== 'undefined') {
                console.log('Bootstrap disponível');
                var modal = new bootstrap.Modal(modalCategoria);
                
                document.querySelectorAll('.btn-visualizar').forEach(function(btn) {
                    console.log('Botão encontrado:', btn);
                    btn.addEventListener('click', function(e) {
                        console.log('Botão clicado');
                        var id = this.getAttribute('data-id');
                        var name = this.getAttribute('data-name');
                        console.log('ID:', id, 'Nome:', name);
                        
                        document.getElementById('modalCategoriaId').textContent = id;
                        document.getElementById('modalCategoriaNome').textContent = name;
                        
                        modal.show(); // Forçar a exibição do modal
                    });
                });
            } else {
                console.error('Bootstrap não está disponível');
            }
          });
        </script>
    </div>
</main>
</body>
</html>
